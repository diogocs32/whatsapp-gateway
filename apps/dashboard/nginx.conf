server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip básico
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers (item 19 da auditoria 07/2026). TLS/HSTS ficam no Traefik, na frente.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Assets com hash no nome → cache longo e imutável
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header em location NÃO herda os do server — repete os de segurança aqui.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  # SPA (react-router): qualquer rota não-arquivo cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
