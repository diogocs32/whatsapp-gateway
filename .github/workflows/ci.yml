# CI (item 15 da auditoria 07/2026): lint + typecheck + e2e (contra a MESMA infra do dev, via
# docker compose) + builds. Deploy no Dokploy permanece manual (D-027).
#
# A5/D-052 (27/10/2026): em push na main o job `imagens` envia as imagens testadas ao GHCR com a
# etiqueta sha-<commit>; a promoção à produção é o deploy-production.yml (manual) + Deploy no
# Dokploy; a retenção é o limpeza-ghcr.yml. Runbook: docs/deploy-dokploy.md §6.
#
# P-055 (25/09/2026) — guardas de build, pré-requisito do stop-first (B-004): o job `imagens`
# constrói as MESMAS imagens que o Dokploy constrói (apps/dashboard/Dockerfile e
# apps/gateway/Dockerfile, contexto = raiz), com as guardas do Dockerfile do gateway (patches
# wwebjs e Baileys aplicados, dist/main.js, pacotes do dist no node_modules FINAL, Prisma CLI + config)
# e sobe o container do gateway contra Postgres/Redis/MinIO até o /health responder ok com banco,
# Redis e storage. Imagem que quebraria no boot (ex.: `Cannot find module 'zod'` de 16/08) quebra
# aqui, não em produção.
#
# Auditoria 09/2026 (UP-04/UP-10, ABE-23): permissões mínimas do token, actions pinadas por SHA
# (tag móvel `@v4` podia mudar por baixo), typecheck do dashboard e dos contracts (o Vite só
# transpila — não verifica tipos) e `npm audit` INFORMATIVO (não bloqueia: a triagem de alcance
# vive em docs/auditoria-melhorias-2026-09.md §7.5; bloquear exigiria downgrade perigoso).
#
# E23 (25/09/2026): o painel ganhou testes (apps/dashboard/src/lib/*.spec.ts, vitest em ambiente
# node — funções puras de formato, tempo real e cache de mídia; inclui ida e volta com o
# message-content.ts e o reaction-key.ts do gateway).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # O Chrome do puppeteer não é usado nos testes (wwebjs usa o Chrome do sistema em runtime).
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: '26.10.0'
          cache: npm

      - name: Instalar dependências (allowScripts revisado — E16)
        run: npm ci --strict-allow-scripts

      # O postinstall roda `patch-package --error-on-fail`; a guarda confere ambos os patches.
      - name: Guarda — patches do wwebjs e Baileys aplicados
        run: sh scripts/guardas-build.sh patches

      - name: Env de teste
        run: cp apps/gateway/env.example apps/gateway/.env

      # O typecheck e o build dependem do client gerado (generator prisma-client) — no runner
      # ele não existe até rodar o generate (localmente já está no working tree/node_modules).
      - name: Prisma generate
        run: npm run prisma:generate -w apps/gateway

      - name: Lint
        run: npm run lint

      - name: Formatação (prettier --check)
        run: npm run format:check

      - name: Fronteiras de módulo (dependency-cruiser — ARQUITETURA §Regras)
        run: npm run depcruise

      - name: Typecheck (gateway)
        run: npx tsc --noEmit -p apps/gateway/tsconfig.json

      - name: Typecheck (dashboard)
        run: npx tsc --noEmit -p apps/dashboard/tsconfig.json

      - name: Typecheck (contracts)
        run: npx tsc --noEmit -p packages/contracts/tsconfig.json

      - name: Testes do painel (vitest, ambiente node — sem infra)
        run: npm run test -w apps/dashboard

      - name: Auditoria npm (informativa — triagem em docs/auditoria-melhorias-2026-09.md §7.5)
        run: npm audit --audit-level=high --omit=dev || true

      - name: Infra (Postgres + Redis + MinIO)
        run: docker compose up -d --wait

      - name: Bucket de mídia (MinIO)
        run: |
          docker run --rm --network host --entrypoint sh pgsty/mc:RELEASE.2026-09-16T00-00-00Z -c \
            "mc alias set local http://localhost:9000 minio minio12345 && mc mb -p local/wa-media"

      - name: Migrations
        run: npm run prisma:deploy -w apps/gateway

      - name: Testes (unit + e2e) com cobertura
        run: npm run test:cov -w apps/gateway

      - name: Build (gateway)
        run: npm run gateway:build

      - name: Guarda — entrypoint dist/main.js gerado
        run: sh scripts/guardas-build.sh dist

      - name: Build (dashboard)
        run: npm run dashboard:build

  # A5/D-052 (27/10/2026) — imagem pronta, promoção por etiqueta: em PR monta e testa as duas
  # imagens, sem envio; em push na main, as MESMAS imagens testadas vão ao GHCR só com a etiqueta
  # imutável sha-<12 do commit> (nada de main/latest). O job só começa depois do `ci` (needs) e o
  # envio é o último passo: só vai ao GHCR imagem com o CI inteiro aprovado. A produção puxa a
  # etiqueta móvel `producao`, que só o deploy-production.yml move (à mão); o Dokploy não monta nada.
  imagens:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      GATEWAY_IMAGE: ghcr.io/diogocs32/conexozenvo-gateway
      DASHBOARD_IMAGE: ghcr.io/diogocs32/conexozenvo-dashboard
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Build-time (embutida no bundle — apps/dashboard/Dockerfile:4-5): era Build Time Argument do
      # Dokploy; com a imagem montada aqui, vem da variável de repositório VITE_API_URL (não secreta).
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - name: Variável VITE_API_URL definida (obrigatória para publicar o dashboard)
        if: env.PUBLICAR == 'true'
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::Falta a variável de repositório VITE_API_URL (Settings → Secrets and variables → Actions → Variables): sem ela o bundle do dashboard sai sem o endereço da API de produção."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: '26.10.0'
          package-manager-cache: false

      # Os dois apps do Dokploy são construídos com estes Dockerfiles (contexto = raiz). Quebra de
      # build aqui = PR vermelho, em vez de deploy travado no Dokploy (ex.: 25/09, o dashboard
      # quebraria com o `--error-on-fail` se a pasta patches/ continuasse no build dele).
      # `--provenance=false --sbom=false`: sem eles, o Docker com image store do containerd monta um
      # índice com atestado (manifesto sem etiqueta) — a limpeza do GHCR o apagaria e quebraria a
      # imagem. Cada imagem tem de ser UM manifesto (conferido após o envio). Teste de 27/10 num
      # registry local, Docker 29.8 / buildx 0.37.1: sem as flags → image.index; com → image.manifest.
      - name: Build da imagem do dashboard (apps/dashboard/Dockerfile — o mesmo do Dokploy)
        run: |
          docker build --provenance=false --sbom=false \
            --build-arg VITE_API_URL \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f apps/dashboard/Dockerfile -t dashboard:ci .

      # E16 / R15: a troca de nginx exige servir os assets e as rotas da SPA de verdade.
      - name: Smoke HTTP do dashboard (imagem pronta, sem conta/API)
        run: |
          docker run -d --name dashboard -p 127.0.0.1:8080:80 dashboard:ci
          docker exec dashboard nginx -t
          node scripts/smoke-dashboard.mjs http://127.0.0.1:8080

      # As guardas do gateway rodam DENTRO do build: se falharem, o `docker build` sai com erro.
      - name: Build da imagem do gateway (apps/gateway/Dockerfile — o mesmo do Dokploy)
        run: |
          docker build --provenance=false --sbom=false \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f apps/gateway/Dockerfile -t gateway:ci .

      - name: Infra (Postgres + Redis + MinIO)
        run: docker compose up -d --wait

      - name: Bucket de mídia (MinIO)
        run: |
          docker run --rm --network host --entrypoint sh pgsty/mc:RELEASE.2026-09-16T00-00-00Z -c \
            "mc alias set local http://localhost:9000 minio minio12345 && mc mb -p local/wa-media"

      # Boot real da imagem: entrypoint (chown + gosu) → prisma migrate deploy → Nest → /health ok
      # com banco, Redis e storage (o /health responde 200 mesmo com storage=false, por isso o jq
      # confere o corpo). Segredos gerados na hora (descartáveis, só existem neste runner).
      - name: Smoke do container (migrate deploy + boot + /health)
        run: |
          docker run -d --name gw --network host \
            -e DATABASE_URL='postgresql://gateway:gateway@localhost:5436/gateway?schema=public' \
            -e REDIS_URL='redis://localhost:6382' \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e DASHBOARD_USERNAME=admin -e DASHBOARD_PASSWORD="$(openssl rand -hex 12)" \
            -e CORS_ORIGIN=http://localhost:5173 -e PORT=3000 \
            -e S3_ENDPOINT=http://localhost:9000 -e S3_REGION=us-east-1 -e S3_BUCKET=wa-media \
            -e S3_ACCESS_KEY=minio -e S3_SECRET_KEY=minio12345 -e S3_FORCE_PATH_STYLE=true \
            gateway:ci
          for i in $(seq 1 60); do
            if curl -fsS --max-time 10 http://127.0.0.1:3000/health |
              jq -e '.status == "ok" and .checks.database and .checks.redis and .checks.storage'; then
              echo "health ok (banco, Redis e storage) em ~$((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error::o container não respondeu /health ok (banco, Redis e storage) em 120 s"
          docker logs gw 2>&1 | tail -100
          exit 1

      - name: Smoke de autenticação da API (R15)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
            -H 'X-Api-Key: cz_smoke_invalida' -H 'content-type: application/json' \
            -d '{}' http://127.0.0.1:3000/api/sessions)
          test "$code" = 401 || { echo "::error::API key inválida retornou $code (esperado 401)"; exit 1; }
          # Admin descartável criado neste runner. IP reservado separa este sucesso do teste
          # do balde de 10 falhas abaixo (o adapter usa trustProxy:true). Login mantém 201
          # do contrato atual; não mudar a rota para satisfazer o 200 genérico da R15.
          docker exec -i gw node --input-type=module <<'JS'
          const response = await fetch('http://127.0.0.1:3000/api/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-forwarded-for': '192.0.2.16' },
            body: JSON.stringify({ username: process.env.DASHBOARD_USERNAME, password: process.env.DASHBOARD_PASSWORD }),
            signal: AbortSignal.timeout(10000),
          });
          await response.arrayBuffer();
          if (response.status !== 201 || !response.headers.get('set-cookie')) {
            throw new Error(`Login descartável retornou ${response.status} (esperado 201 com cookie)`);
          }
          console.log('login do painel: 201 com cookie; API key inválida: 401');
          JS

      # P-053: o main.ts REAL da imagem limita o login pela rota resolvida — 10 tentativas alternando
      # origin-form, %-encoding e forma absoluta contam no MESMO balde e a 11ª é 429 (antes, as
      # variantes caíam no teto global de 600/min). Corpo inválido → 401 sem custo de scrypt.
      - name: Smoke do rate-limit do login (rota resolvida — P-053)
        run: |
          base=http://127.0.0.1:3000
          # `|| true`: com `bash -e` uma falha de transporte do curl (conexão recusada/fechada, timeout)
          # abortaria o passo sem ::error::; o -w já imprime 000 e cai nos ifs abaixo.
          tentar() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
              -H 'content-type: application/json' -d '{}' "$@" || true
          }
          for i in $(seq 1 10); do
            case $((i % 4)) in
              0) code=$(tentar "$base/api/auth/login") ;;
              1) code=$(tentar "$base/api/auth/%6Cogin") ;;
              2) code=$(tentar "$base/%61pi/auth/login") ;;
              3) code=$(tentar --request-target "$base/api/auth/login" "$base/") ;;
            esac
            if [ "$code" != 401 ]; then
              echo "::error::tentativa $i de login deu $code (esperado 401)"
              docker logs gw 2>&1 | tail -50
              exit 1
            fi
          done
          code=$(tentar --request-target "$base/api/auth/%6Cogin" "$base/")
          if [ "$code" != 429 ]; then
            echo "::error::11ª tentativa de login deu $code (esperado 429 — teto do login contornado?)"
            docker logs gw 2>&1 | tail -50
            exit 1
          fi
          echo "login: 10 × 401 e a 11ª = 429 (origin-form, %-encoding e forma absoluta no mesmo balde)"

      # A5/D-052: só em push na main, e como ÚLTIMO passo — as imagens acima já passaram por build,
      # guardas e smokes; o que vai ao GHCR é exatamente o que está no daemon (docker push da imagem
      # carregada, sem rebuild). Login pelo CLI com o GITHUB_TOKEN (via env, nunca no texto do run).
      - name: Enviar as imagens ao GHCR (etiqueta sha-<commit>)
        if: env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
          tag="sha-${GITHUB_SHA::12}"
          publicar() {
            docker tag "$1" "$2:${tag}"
            docker push "$2:${tag}"
            # Um manifesto só (sem índice/atestado): é o que a limpeza do GHCR pressupõe.
            tipo=$(docker buildx imagetools inspect --raw "$2:${tag}" | jq -r .mediaType)
            case "${tipo}" in
              *image.manifest*) echo "✅ $2:${tag} (${tipo})" ;;
              *)
                echo "::error::$2:${tag} foi enviada como ${tipo}; esperado um manifesto só (a limpeza apagaria partes dele)."
                exit 1
                ;;
            esac
          }
          publicar gateway:ci "${GATEWAY_IMAGE}"
          publicar dashboard:ci "${DASHBOARD_IMAGE}"
          {
            echo "### Imagens no GHCR"
            echo "- \`${GATEWAY_IMAGE}:${tag}\`"
            echo "- \`${DASHBOARD_IMAGE}:${tag}\`"
            echo
            echo "Publicar: Actions → deploy-production → app + image_tag=\`${tag}\` + confirm=\`promover\`; depois Deploy no Dokploy (docs/deploy-dokploy.md §6)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Portão único (A5/D-052): é o check a marcar como obrigatório na proteção da main (ação do
  # dono — B-008). `!cancelled()` em vez de always(): roda com sucesso ou falha dos anteriores, mas
  # não numa execução cancelada.
  ci-completo:
    name: CI (portão)
    needs: [ci, imagens]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Conferir os jobs obrigatórios
        env:
          RES_CI: ${{ needs.ci.result }}
          RES_IMAGENS: ${{ needs.imagens.result }}
        run: |
          echo "ci=${RES_CI} imagens=${RES_IMAGENS}"
          if [ "${RES_CI}" != success ] || [ "${RES_IMAGENS}" != success ]; then
            echo "::error::job obrigatório sem sucesso (ci=${RES_CI}, imagens=${RES_IMAGENS})"
            exit 1
          fi
