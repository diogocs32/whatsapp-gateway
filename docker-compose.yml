name: whatsapp-gateway-dev

# Infraestrutura local de desenvolvimento (Postgres + Redis + MinIO).
# A aplicação (gateway) e o dashboard rodam no host via `npm run dev`.
# Em produção, o deploy é no Dokploy (ver PROMPT-MESTRE-WHATSAPP-GATEWAY.md §19).

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      # 5432-5435 já ocupadas por outros projetos no host (saas, rv, escalamedica, redecidades)
      - '5436:5432'
    volumes:
      # PostgreSQL 18+: o volume vai em /var/lib/postgresql (NÃO /data) — a imagem
      # passou a guardar os dados num subdiretório por versão. Mount em /data faz crash-loop.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gateway']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # 6379-6381 já ocupadas por outros projetos no host
      - '6382:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # quay.io = registro oficial da MinIO (as imagens saíram do Docker Hub em 2025 — "pull access
    # denied" derrubou o CI em 15/09/2026). Tag PINADA: infra de dev/CI não muda por baixo.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
